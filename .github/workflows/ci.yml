name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TargaSharp.sln

      - name: Build
        run: dotnet build TargaSharp.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test TargaSharp.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  pack:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # Trusted Publishing: nuget.org trusts this repo + workflow via OIDC; no long-lived API key.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: |
          dotnet pack TargaSharp/TargaSharp.csproj --configuration Release --output nupkg
          dotnet pack TargaSharp.Drawing/TargaSharp.Drawing.csproj --configuration Release --output nupkg

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: bigguy3311

      - name: Push to nuget.org
        run: dotnet nuget push "nupkg/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
